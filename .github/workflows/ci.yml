name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Format
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -race ./...
      - name: Native build
        run: go build ./cmd/ywd-aprsd ./cmd/ywd-aprsctl
      - name: Pi Zero ARMv6 build
        env: { GOOS: linux, GOARCH: arm, GOARM: '6' }
        run: go build -o /tmp/ywd-aprsd-armv6 ./cmd/ywd-aprsd
      - name: ARMv7 build
        env: { GOOS: linux, GOARCH: arm, GOARM: '7' }
        run: go build -o /tmp/ywd-aprsd-armv7 ./cmd/ywd-aprsd
      - name: ARM64 build
        env: { GOOS: linux, GOARCH: arm64 }
        run: go build -o /tmp/ywd-aprsd-arm64 ./cmd/ywd-aprsd
