<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YWD-APRS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{color-scheme:dark;--bg:#05080b;--panel:#0b1117;--line:#20313b;--fg:#d8e7ed;--muted:#8196a0;--cyan:#33e6ff;--mag:#ff3ac8;--ok:#62f59a;--bad:#ff6577}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{display:grid;grid-template-rows:58px 1fr 230px;overflow:hidden}header{display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid var(--line);background:#070d12;box-shadow:0 0 24px #001c22}h1{font-size:20px;margin:0;color:var(--cyan);letter-spacing:.13em}#identity{color:var(--muted)}.pill{border:1px solid var(--line);padding:6px 10px;border-radius:999px;font-size:12px}.ok{color:var(--ok);border-color:#24623c}.bad{color:var(--bad);border-color:#642b37}main{min-height:0;display:grid;grid-template-columns:1fr 330px}.mapwrap{position:relative;min-width:0}.mapfallback{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);background:radial-gradient(circle at center,#10232a,#05080b 65%)}#map{height:100%;z-index:2}.side{border-left:1px solid var(--line);background:var(--panel);overflow:auto}.sectiontitle{position:sticky;top:0;background:#0b1117ee;padding:12px 14px;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.12em;color:var(--cyan);z-index:4}.station{padding:10px 14px;border-bottom:1px solid #15212a;cursor:pointer}.station:hover{background:#101a22}.call{color:#fff;font-weight:700}.meta{color:var(--muted);font-size:12px;margin-top:4px}.pos{color:var(--cyan)}footer{border-top:1px solid var(--line);background:#060a0e;min-height:0;display:grid;grid-template-rows:34px 1fr}.monitorhead{display:flex;align-items:center;gap:16px;padding:0 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}#packets{overflow:auto;font-size:12px}.pkt{display:grid;grid-template-columns:90px 95px 1fr;gap:8px;padding:5px 10px;border-bottom:1px solid #101920}.pkt .src{color:var(--cyan)}.pkt .raw{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kind{color:var(--mag)}.leaflet-container{background:#071015}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#0b1117;color:var(--fg)}@media(max-width:800px){body{grid-template-rows:58px 1fr 200px}main{grid-template-columns:1fr}.side{display:none}.pkt{grid-template-columns:75px 80px 1fr}#identity{display:none}}
</style>
</head>
<body>
<header><h1>YWD-APRS</h1><span id="identity">loading...</span><span id="kiss" class="pill bad">KISS OFFLINE</span><span id="stats" class="pill">RX 0</span><span id="version" class="pill"></span></header>
<main><section class="mapwrap"><div class="mapfallback">MAP INITIALIZING // Leaflet requires browser internet in this dev build</div><div id="map"></div></section><aside class="side"><div class="sectiontitle">LAST HEARD</div><div id="stations"></div></aside></main>
<footer><div class="monitorhead"><span>PACKET MONITOR</span><span id="parse"></span><span>RX ONLY // TX PATH ABSENT</span></div><div id="packets"></div></footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
let cfg=null,map=null,tile=null,markers=new Map(),firstFix=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const age=t=>{if(!t)return'never';let s=Math.max(0,Math.floor((Date.now()-new Date(t))/1000));if(s<60)return s+'s';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d'};
async function init(){cfg=await fetch('/api/v1/public-config').then(r=>r.json());document.title=cfg.title;document.getElementById('identity').textContent=cfg.callsign+' // RX CONSOLE';document.getElementById('version').textContent=cfg.version;if(window.L){map=L.map('map',{preferCanvas:true}).setView((cfg.latitude||cfg.longitude)?[cfg.latitude,cfg.longitude]:[40.5865,-122.3917],10);tile=L.tileLayer(cfg.tile_url,{maxZoom:19,attribution:cfg.attribution}).addTo(map);}await refresh();setInterval(refresh,1000)}
async function refresh(){try{let s=await fetch('/api/v1/state?limit=120',{cache:'no-store'}).then(r=>r.json());render(s)}catch(e){document.getElementById('kiss').textContent='API OFFLINE';document.getElementById('kiss').className='pill bad'}}
function render(s){let k=s.runtime.kiss,ke=document.getElementById('kiss');ke.textContent=k.connected?'● KISS ONLINE':'● KISS OFFLINE';ke.className='pill '+(k.connected?'ok':'bad');document.getElementById('stats').textContent='RX '+k.rx_frames+' // STN '+s.stations.length;document.getElementById('parse').textContent='PARSE ERR '+s.runtime.parse_errors;document.getElementById('stations').innerHTML=s.stations.map(x=>`<div class="station" onclick="focusCall('${esc(x.callsign)}')"><div class="call">${esc(x.callsign)}</div><div class="meta">${esc(x.kind)} · ${age(x.last_heard)} · ${x.packets} pkt</div>${x.has_position?`<div class="meta pos">${x.latitude.toFixed(5)}, ${x.longitude.toFixed(5)}</div>`:''}<div class="meta">${esc(x.comment||x.destination)}</div></div>`).join('');document.getElementById('packets').innerHTML=s.packets.map(p=>`<div class="pkt"><span>${new Date(p.received_at).toLocaleTimeString()}</span><span class="src">${esc(p.source)}</span><span class="raw"><span class="kind">${esc(p.kind)}</span> ${esc(p.tnc2)}</span></div>`).join('');if(map){let seen=new Set();for(const x of s.stations){if(!x.has_position)continue;seen.add(x.callsign);let m=markers.get(x.callsign),html=`<b>${esc(x.callsign)}</b><br>${x.latitude.toFixed(5)}, ${x.longitude.toFixed(5)}<br>${esc(x.comment||'')}<br><small>${esc(x.last_tnc2)}</small>`;if(!m){m=L.circleMarker([x.latitude,x.longitude],{radius:7,weight:2}).addTo(map);markers.set(x.callsign,m)}else m.setLatLng([x.latitude,x.longitude]);m.bindPopup(html);if(!firstFix){map.setView([x.latitude,x.longitude],12);firstFix=true}}for(const [call,m] of markers){if(!seen.has(call)){m.remove();markers.delete(call)}}}}
function focusCall(call){let m=markers.get(call);if(m){map.setView(m.getLatLng(),14);m.openPopup()}}
init();
</script>
</body></html>
